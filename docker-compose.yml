version: '3.8'

services:
  backend:
    build: .
    container_name: rag_backend_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  nginx:
    image: nginx:alpine
    container_name: rag_nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend